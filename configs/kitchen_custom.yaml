# Dynamic kitchen environment configuration

# 1. Custom environment configuration
mini_env:
  enabled: true
  spawn_pos: [2.0, -1.0]    # Initial robot XY position; adjust for the scene as needed
  # Scene selection: no_island / island / random
  scene_mode: no_island
  layout_ids: [0, 1]        # For random: 0=no island, 1=island
  style_ids: [0]            # 0=industrial style
  fixed_base: true           # Fix the base; base control is excluded from the action space
  fixed_body: true           # Fix the head and torso; expose only [dx, dy, dz, gripper]

# Object placement: set placement.fixture and placement.pos for each object
# largest_counter selects the largest counter in the isolated area, usually the large central table.
placement:
  fixture: random
  largest_counter_weight: 8

# 2. Object list
# Each object can specify its own placement fixture and local position.
# pos is approximately in [-1, 1]: x=-1 left, x=0 center, x=1 right; similarly for y.
objects:
  - group: apple
    placement:
      fixture: counter_main
      pos: [-0.65, 0.0]

  - group: banana
    placement:
      fixture: counter_main
      pos: [0.25, 0.0]
